name: Daily NBA Stats Update

on:
  push:
    branches: [main]
    paths:
      - "app.js"
      - "update_nba_stats.py"
      - ".github/workflows/daily-nba-update.yml"
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-nba-update
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch verified NBA season stats
        run: python update_nba_stats.py --pause 1.5 --top 400
      - name: Validate real data snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/nba_stats.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          assert d.get("meta",{}).get("source") == "nba_api", "Snapshot is not real NBA API data"
          assert len(d.get("players",[])) >= 50, "Too few player records"
          assert set(d["meta"].get("periods",[])) == {"season","l5","l10"}
          assert all(x.get("name") and x.get("teamAbbr") for x in d["players"])
          print("Validated",len(d["players"]),"NBA players; season",d["meta"]["season"])
          PY
      - name: Commit updated snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba_stats.json
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "chore(data): publish real NBA season stats"
            git push
          fi
