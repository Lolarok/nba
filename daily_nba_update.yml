name: Daily NBA Stats Update

on:
  schedule:
    - cron: "0 8 * * *" # ogni giorno alle 08:00 UTC
  workflow_dispatch: {} # aggiornamento manuale dal tab Actions

permissions:
  contents: write

concurrency:
  group: daily-nba-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Update NBA stats (nba_api)
        env:
          NBA_PAUSE: "1.5"
        run: |
          python scripts/update_nba_stats.py --pause "$NBA_PAUSE" --top 120

      - name: Verify JSON integrity
        run: |
          python - <<'PY'
          import json, sys
          with open("data/nba_stats.json", encoding="utf-8") as fh:
              doc = json.load(fh)
          n = len(doc.get("players", []))
          print(f"JSON valido: {n} giocatori, aggiornato {doc['meta']['lastUpdated']}")
          assert n > 0, "JSON vuoto: qualcosa è andato storto"
          PY

      - name: Commit updated data (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/nba_stats.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica: commit saltato"
          else
            git commit -m "chore(data): aggiornamento automatico statistiche NBA $(date -u +%F)"
            git push
          fi
